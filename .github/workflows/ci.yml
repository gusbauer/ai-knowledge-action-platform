name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Python application
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16

        env:
          POSTGRES_DB: ai_platform_test
          POSTGRES_USER: ai_platform_test
          POSTGRES_PASSWORD: ai_platform_test

        ports:
          - 5433:5432

        options: >-
          --health-cmd "pg_isready -U ai_platform_test -d ai_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ai_platform_test:ai_platform_test@localhost:5433/ai_platform_test
      TEST_DATABASE_URL: postgresql+psycopg://ai_platform_test:ai_platform_test@localhost:5433/ai_platform_test
      ENVIRONMENT: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile application
        run: python -m compileall app

      - name: Run unit and API tests
        run: python -m pytest -v -m "not integration"

      - name: Run integration and AI evaluation tests
        run: python -m pytest -v -m integration
