services:
  db_test:
    image: pgvector/pgvector:pg16
    container_name: ai-platform-postgres-test

    environment:
      POSTGRES_DB: ai_platform_test
      POSTGRES_USER: ai_platform_test
      POSTGRES_PASSWORD: ai_platform_test

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_platform_test -d ai_platform_test"]
      interval: 5s
      timeout: 5s
      retries: 5
  db:
    image: pgvector/pgvector:pg16
    container_name: ai-platform-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  postgres_data:
